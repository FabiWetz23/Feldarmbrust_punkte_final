<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Crossbow Scoring System - Admin UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
            margin: 5px;
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .leaderboard {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .leaderboard th,
        .leaderboard td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        .leaderboard th {
            background: #3498db;
            color: white;
            font-weight: 600;
        }

        .leaderboard tr:hover {
            background: #f8f9fa;
        }

        .rank {
            font-weight: bold;
            color: #3498db;
            font-size: 1.2em;
        }

        .score {
            font-weight: bold;
            color: #27ae60;
        }

        .scorecard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .scorecard-table th,
        .scorecard-table td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 0.8em;
        }

        .scorecard-table th {
            background: #366092;
            color: white;
            font-weight: bold;
        }

        .scorecard-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .scorecard-table .shooter-name {
            text-align: left;
            font-weight: bold;
        }

        .scorecard-table .total-cell {
            background: #e8f4fd;
            font-weight: bold;
        }

        .scorecard-table .running-total {
            background: #fff2cc;
            font-weight: bold;
        }

        .scorecard-table .final-score {
            background: #d4edda;
            font-weight: bold;
            color: #155724;
        }

        .elimination-bracket {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .match-card {
            border: 2px solid #366092;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
        }

        .bronze-match {
            border-color: #cd7f32;
            background: #fdf5e6;
        }

        .gold-match {
            border-color: #ffd700;
            background: #fffef0;
        }

        .match-winner {
            color: #155724;
            font-weight: bold;
        }

        .shooter-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .shooter-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shooter-info h4 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .shooter-info p {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .shooter-actions {
            display: flex;
            gap: 10px;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .series-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #3498db;
        }

        .series-card h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .series-shots {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .shot-badge {
            background: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .notification.success {
            background: #27ae60;
        }

        .notification.error {
            background: #e74c3c;
        }

        .notification.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🏹 Field Crossbow Scoring System</h1>
            <p>Central server for wireless scoring in competitions</p>
            <div style="margin-top: 20px;">
                <button class="btn" onclick="refreshData()">🔄 Refresh Data</button>
                <a href="/export" class="btn btn-success">📊 Excel Export</a>
                <button class="btn btn-warning" onclick="showAddShooterModal()">➕ Add Competitor</button>
                <button class="btn btn-warning" onclick="showAddSeriesModal()">📝 Add Series</button>
                <button class="btn btn-danger" onclick="resetCompetition()">🗑️ Reset Data</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="totalShooters">0</div>
                <div class="stat-label">Competitors</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-number" id="totalSeries">0</div>
                <div class="stat-label">Ends</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💫</div>
                <div class="stat-number" id="totalShots">0</div>
                <div class="stat-label">Shots</div>
            </div>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>🏆 Leaderboard</h2>
                <table class="leaderboard" id="leaderboard">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>No</th>
                            <th>Competitor</th>
                            <th>Country</th>
                            <th>Total</th>
                            <th>Ends</th>
                            <th>Ø</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: #7f8c8d;">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="panel">
                <h2>👥 Competitors & Ends</h2>
                <div class="shooter-list" id="shooterList">
                    <div style="text-align: center; color: #7f8c8d;">Loading data...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Schützen hinzufügen Modal -->
    <div id="addShooterModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addShooterModal')">&times;</span>
            <h2>Add Competitor</h2>
            <form id="addShooterForm">
                <div class="form-group">
                    <label for="shooterId">Competitor ID:</label>
                    <input type="text" id="shooterId" required>
                </div>
                <div class="form-group">
                    <label for="shooterNo">No:</label>
                    <input type="text" id="shooterNo" required>
                </div>
                <div class="form-group">
                    <label for="shooterName">Competitor Name:</label>
                    <input type="text" id="shooterName" required>
                </div>
                <div class="form-group">
                    <label for="shooterClub">Club:</label>
                    <input type="text" id="shooterClub" required>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-danger" onclick="closeModal('addShooterModal')">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Serie hinzufügen Modal -->
    <div id="addSeriesModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addSeriesModal')">&times;</span>
            <h2>Add End</h2>
            <form id="addSeriesForm">
                <div class="form-group">
                    <label for="seriesId">Series ID:</label>
                    <input type="text" id="seriesId" required>
                </div>
                <div class="form-group">
                    <label for="seriesShooter">Competitor:</label>
                    <select id="seriesShooter" required>
                        <option value="">Select competitor...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="seriesRound">End:</label>
                    <input type="number" id="seriesRound" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="seriesShots">Shots per end:</label>
                    <input type="number" id="seriesShots" min="1" max="12" value="6" required>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-danger" onclick="closeModal('addSeriesModal')">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Schuss hinzufügen Modal -->
    <div id="addShotModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addShotModal')">&times;</span>
            <h2>Add/Edit Shot</h2>
            <form id="addShotForm">
                <input type="hidden" id="shotSeriesId">
                <div class="form-group">
                    <label for="shotNumber">Shot Number:</label>
                    <input type="number" id="shotNumber" min="1" required>
                </div>
                <div class="form-group">
                    <label for="shotScore">Score:</label>
                    <input type="number" id="shotScore" min="0" max="10" step="0.5" required>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-danger" onclick="closeModal('addShotModal')">Cancel</button>
            </form>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        let currentData = null;

        async function loadData() {
            try {
                const response = await fetch('/state');
                currentData = await response.json();
                updateUI();
            } catch (error) {
                showNotification('Error loading data', 'error');
            }
        }

        function updateUI() {
            if (!currentData) return;

            const stats = currentData.statistics;
            const leaderboard = currentData.leaderboard;
            const competition = currentData.competition;

            // Update statistics
            document.getElementById('totalShooters').textContent = stats.total_shooters;
            document.getElementById('totalSeries').textContent = stats.total_series;
            document.getElementById('totalShots').textContent = stats.total_shots;
            document.getElementById('averageScore').textContent = stats.average_score.toFixed(2);

            // Create IAU Field Crossbow Score Sheet
            const leaderboardBody = document.getElementById('leaderboardBody');
            leaderboardBody.innerHTML = '';

            // Create scorecard table
            const scorecardTable = document.createElement('table');
            scorecardTable.className = 'scorecard-table';

            // Calculate max rounds
            const maxRounds = Math.max(...leaderboard.map(entry => {
                const shooterSeries = Object.values(competition.series).filter(s => s.shooter_id === entry.shooter.id);
                return Math.max(...shooterSeries.map(s => s.round_number || 1), 0);
            }), 0);

            // Create header
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = '<th>Rank</th><th>No</th><th>Shooter Name</th><th>Club/Country</th>';
            for (let i = 1; i <= maxRounds; i++) {
                headerRow.innerHTML += `<th>End ${i}</th>`;
            }
            headerRow.innerHTML += '<th>Running Total</th><th>Final Total</th><th>Inner Hits (10s/Xs)</th>';
            scorecardTable.appendChild(headerRow);

            // Create rows for each shooter
            leaderboard.forEach((entry, index) => {
                const shooterSeries = Object.values(competition.series).filter(s => s.shooter_id === entry.shooter.id);
                const sortedSeries = shooterSeries.sort((a, b) => (a.round_number || 1) - (b.round_number || 1));
                let runningTotal = 0;

                const row = document.createElement('tr');
                row.innerHTML = `<td><strong>${index + 1}</strong></td>`;
                row.innerHTML += `<td>${entry.shooter.start_number || '-'}</td>`;
                row.innerHTML += `<td class="shooter-name">${entry.shooter.name}</td>`;
                row.innerHTML += `<td>${entry.shooter.club || ''}</td>`;

                // Display individual shots for each end
                for (let i = 1; i <= maxRounds; i++) {
                    const series = sortedSeries.find(s => s.round_number === i);
                    if (series && series.shots) {
                        const shotValues = series.shots.map(shot => shot.score).join(', ');
                        const endTotal = series.get_series_sum ? series.get_series_sum() : series.shots.reduce((sum, shot) => sum + shot.score, 0);
                        row.innerHTML += `<td><small>${shotValues}</small><br><strong>(${endTotal.toFixed(1)})</strong></td>`;
                        runningTotal += endTotal;
                    } else {
                        row.innerHTML += '<td>-</td>';
                    }
                }

                const lastEndTotal = sortedSeries.length > 0 ?
                    (sortedSeries[sortedSeries.length - 1].get_series_sum ?
                        sortedSeries[sortedSeries.length - 1].get_series_sum() :
                        sortedSeries[sortedSeries.length - 1].shots.reduce((sum, shot) => sum + shot.score, 0)) : 0;

                row.innerHTML += `<td class="running-total">${runningTotal.toFixed(1)}</td>`;
                row.innerHTML += `<td class="final-score">${entry.total_score.toFixed(1)}</td>`;

                // Count inner hits (10s)
                const innerHits = shooterSeries.reduce((count, series) => {
                    return count + series.shots.filter(shot => shot.score === 10).length;
                }, 0);
                row.innerHTML += `<td>${innerHits}</td>`;

                scorecardTable.appendChild(row);
            });

            leaderboardBody.appendChild(scorecardTable);

            // Schützen und Serien aktualisieren
            updateShooterList(competition);
        }

        function updateShooterList(competition) {
            const shooterList = document.getElementById('shooterList');
            shooterList.innerHTML = '';

            Object.values(competition.shooters).forEach(shooter => {
                const shooterDiv = document.createElement('div');
                shooterDiv.className = 'shooter-item';

                const series = Object.values(competition.series).filter(s => s.shooter_id === shooter.id);
                const totalScore = series.reduce((sum, s) => sum + s.shots.reduce((shotSum, shot) => shotSum + shot.score, 0), 0);

                shooterDiv.innerHTML = `
                    <div class="shooter-info">
                        <h4>${shooter.name} ${shooter.start_number ? '(' + shooter.start_number + ')' : ''}</h4>
                        <p>${shooter.club} | Total: ${totalScore.toFixed(1)} | ${series.length} Ends</p>
                    </div>
                    <div class="shooter-actions">
                        <button class="btn btn-warning" onclick="showAddShotModal('${shooter.id}')">Shot</button>
                        <button class="btn btn-danger" onclick="deleteShooter('${shooter.id}')">Delete</button>
                    </div>
                `;

                shooterList.appendChild(shooterDiv);

                // Serien anzeigen
                if (series.length > 0) {
                    const seriesGrid = document.createElement('div');
                    seriesGrid.className = 'series-grid';
                    seriesGrid.style.marginTop = '15px';

                    series.forEach(s => {
                        const seriesCard = document.createElement('div');
                        seriesCard.className = 'series-card';

                        const shotsHtml = s.shots.map(shot =>
                            `<span class="shot-badge">${shot.score}</span>`
                        ).join('');

                        seriesCard.innerHTML = `
                            <h4>End ${s.round_number}</h4>
                            <p>End: ${s.id} | Sum: ${s.get_series_sum ? s.get_series_sum().toFixed(1) : s.shots.reduce((sum, shot) => sum + shot.score, 0).toFixed(1)}</p>
                            <div class="series-shots">${shotsHtml}</div>
                            <div style="margin-top: 10px;">
                                <button class="btn btn-warning" onclick="showAddShotModal('${shooter.id}', '${s.id}')">Edit</button>
                                <button class="btn btn-danger" onclick="deleteSeries('${s.id}')">Delete</button>
                            </div>
                        `;

                        seriesGrid.appendChild(seriesCard);
                    });

                    shooterList.appendChild(seriesGrid);
                }
            });
        }

        function showAddShooterModal() {
            document.getElementById('addShooterModal').style.display = 'block';
        }

        function showAddSeriesModal() {
            // Schützen-Select füllen
            const select = document.getElementById('seriesShooter');
            select.innerHTML = '<option value="">Select shooter...</option>';

            if (currentData) {
                Object.values(currentData.competition.shooters).forEach(shooter => {
                    const option = document.createElement('option');
                    option.value = shooter.id;
                    option.textContent = `${shooter.name} (${shooter.club})`;
                    select.appendChild(option);
                });
            }

            document.getElementById('addSeriesModal').style.display = 'block';
        }

        function showAddShotModal(shooterId, seriesId = null) {
            document.getElementById('shotSeriesId').value = seriesId || '';
            document.getElementById('addShotModal').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function refreshData() {
            loadData();
            showNotification('Data refreshed', 'success');
        }

        // Event Listener
        document.getElementById('addShooterForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                id: document.getElementById('shooterId').value,
                start_number: document.getElementById('shooterNo').value,
                name: document.getElementById('shooterName').value,
                club: document.getElementById('shooterClub').value
            };

            try {
                const response = await fetch('/shooters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showNotification('Competitor added', 'success');
                    closeModal('addShooterModal');
                    document.getElementById('addShooterForm').reset();
                    loadData();
                } else {
                    showNotification('Error adding shooter', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        });

        document.getElementById('addSeriesForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                id: document.getElementById('seriesId').value,
                shooter_id: document.getElementById('seriesShooter').value,
                round_number: parseInt(document.getElementById('seriesRound').value),
                shots_per_series: parseInt(document.getElementById('seriesShots').value)
            };

            try {
                const response = await fetch('/series', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showNotification('Series added', 'success');
                    closeModal('addSeriesModal');
                    document.getElementById('addSeriesForm').reset();
                    loadData();
                } else {
                    showNotification('Error adding series', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        });

        document.getElementById('addShotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const seriesId = document.getElementById('shotSeriesId').value;
            const shotNumber = parseInt(document.getElementById('shotNumber').value);
            const score = parseFloat(document.getElementById('shotScore').value);

            if (!seriesId) {
                showNotification('Please select a series first', 'error');
                return;
            }

            const data = { shot_number: shotNumber, score: score };

            try {
                const response = await fetch(`/series/${seriesId}/shot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showNotification('Shot saved', 'success');
                    closeModal('addShotModal');
                    document.getElementById('addShotForm').reset();
                    loadData();
                } else {
                    showNotification('Error saving shot', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        });

        async function deleteShooter(shooterId) {
            if (!confirm('Delete competitor and all associated series?')) return;

            try {
                const response = await fetch(`/shooters/${shooterId}`, { method: 'DELETE' });

                if (response.ok) {
                    showNotification('Competitor deleted', 'success');
                    loadData();
                } else {
                    showNotification('Error deleting', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        }

        async function deleteSeries(seriesId) {
            if (!confirm('Delete series?')) return;

            try {
                const response = await fetch(`/series/${seriesId}`, { method: 'DELETE' });

                if (response.ok) {
                    showNotification('Series deleted', 'success');
                    loadData();
                } else {
                    showNotification('Error deleting', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        }

        async function resetCompetition() {
            if (!confirm('Are you sure you want to delete ALL shooters and series? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch('/clear', {
                    method: 'POST'
                });

                if (response.ok) {
                    showNotification('All data cleared', 'success');
                    loadData();
                } else {
                    showNotification('Error clearing data', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error clearing data', 'error');
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type} show`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Modal schließen wenn außerhalb geklickt wird
        window.onclick = function (event) {
            if (event.target.className === 'modal') {
                event.target.style.display = 'none';
            }
        }

        // Initial laden
        loadData();

        // Alle 10 Sekunden aktualisieren
        setInterval(loadData, 10000);
    </script>
</body>

</html>
